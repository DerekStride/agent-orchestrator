[package]
name = "agent-orchestrator"
version = "0.1.0"
edition = "2021"
description = "Deterministic SQ-driven supervisor for local coding agents"
license = "MIT"
repository = "https://github.com/DerekStride/agent-orchestrator"

[[bin]]
name = "agent-orchestrator"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ulid = "3.0"
